<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiobook Reader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0521a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audiobook">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a18;--ink2:#5a5a54;--ink3:#9a9a90;
  --paper:#faf9f5;--paper2:#f2f1eb;--paper3:#e8e6de;
  --accent:#c0521a;--accent2:#e8c89a;
  --r:12px;--sidebar-w:260px;
}
.dark{
  --ink:#e8e6de;--ink2:#b4b29e;--ink3:#7a7a6e;
  --paper:#1a1916;--paper2:#22211e;--paper3:#2e2d29;
  --accent:#d4703a;--accent2:#5a3a1a;
}
html,body{height:100%;background:var(--paper)}
body{font-family:'Literata',Georgia,serif;color:var(--ink);transition:background .25s,color .25s}
#app{min-height:100vh;position:relative;overflow:hidden;background:var(--paper);transition:background .25s}

/* DROP */
.drop-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.drop-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--paper3);border-radius:20px;padding:3rem 2rem;cursor:pointer;transition:border-color .2s,background .2s;background:var(--paper2);width:100%;max-width:440px}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--paper3)}
.drop-icon{font-size:56px;margin-bottom:1rem;opacity:.4;color:var(--accent)}
.drop-title{font-size:1.4rem;font-weight:300;color:var(--ink);margin-bottom:.5rem}
.drop-sub{font-size:.82rem;color:var(--ink3);font-family:'DM Mono',monospace}
#file-input{display:none}
.theme-toggle{background:var(--paper2);border:1px solid var(--paper3);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);transition:border-color .15s}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.drop-theme{position:absolute;top:1rem;right:1rem}

/* PLAYER */
.player{display:none;flex-direction:row;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--paper2);border-right:1px solid var(--paper3);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s,transform .25s;overflow:hidden}
.sidebar.hidden{width:0}
.sidebar-header{padding:.85rem 1rem;border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-width:var(--sidebar-w)}
.sidebar-title{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.sidebar-tabs{display:flex;gap:.25rem}
.stab{background:none;border:none;border-radius:6px;padding:.25rem .6rem;font-family:'DM Mono',monospace;font-size:.72rem;cursor:pointer;color:var(--ink3);transition:background .15s}
.stab.active{background:var(--accent);color:#fff}
.sidebar-body{flex:1;overflow-y:auto;padding:.5rem 0;min-width:var(--sidebar-w)}
.chapter-item{display:flex;align-items:flex-start;gap:.5rem;padding:.5rem 1rem;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s;color:var(--ink2);line-height:1.4}
.chapter-item:hover{background:var(--paper3)}
.chapter-item.active{border-left-color:var(--accent);color:var(--ink);background:var(--paper3)}
.chapter-num{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ink3);min-width:28px;padding-top:1px}
.chapter-name{font-size:.82rem}
.bm-item{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;cursor:pointer;transition:background .15s}
.bm-item:hover{background:var(--paper3)}
.bm-del{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:14px;margin-left:auto;padding:2px 4px;border-radius:4px}
.bm-del:hover{color:var(--accent)}
.bm-empty{padding:1.5rem 1rem;text-align:center;font-size:.8rem;color:var(--ink3);font-style:italic;line-height:1.6}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.book-header{background:var(--paper2);border-bottom:1px solid var(--paper3);padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.sidebar-toggle{background:none;border:1px solid var(--paper3);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex-shrink:0;transition:border-color .15s}
.sidebar-toggle:hover{border-color:var(--accent);color:var(--accent)}
.book-cover{width:36px;height:48px;background:var(--accent);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:16px}
.book-meta{flex:1;min-width:0}
.book-title{font-size:.9rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-pages{font-size:.7rem;color:var(--ink3);font-family:'DM Mono',monospace;margin-top:2px}
.hdr-btns{display:flex;gap:.35rem;flex-shrink:0}
.hdr-btn{background:none;border:1px solid var(--paper3);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);font-size:15px;transition:border-color .15s,color .15s}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent)}
.hdr-btn.bookmarked{color:var(--accent);border-color:var(--accent)}
.hdr-btn.theme-toggle{border-radius:8px;width:32px;height:32px;position:static}

.resume-banner{background:var(--paper2);border-bottom:1px solid var(--accent2);padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--ink2);flex-shrink:0}
.resume-banner i{color:var(--accent)}
.resume-btn{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.25rem .75rem;font-size:.75rem;font-family:'DM Mono',monospace;cursor:pointer;white-space:nowrap}

.text-area{flex:1;overflow-y:auto;padding:1.5rem 2rem 0}
.page-text{font-size:1.05rem;line-height:1.9;color:var(--ink2);font-weight:300;white-space:pre-wrap;padding-bottom:3rem;max-width:680px;margin:0 auto}
.highlight{background:#fde8c8;color:var(--ink);border-radius:3px}
.dark .highlight{background:#5a3a1a;color:var(--ink)}

.controls{border-top:1px solid var(--paper3);padding:.85rem 1.25rem 1.1rem;background:var(--paper);flex-shrink:0;transition:background .25s}
.progress-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
.time-label{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ink3);min-width:46px}
.time-label.right{text-align:right}
.progress-bar{flex:1;height:4px;background:var(--paper3);border-radius:2px;cursor:pointer;position:relative}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;pointer-events:none;transition:width .1s}
.btn-row{display:flex;align-items:center;justify-content:center;gap:.85rem}
.ctrl-btn{background:none;border:1px solid var(--paper3);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);transition:border-color .15s,color .15s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:52px;height:52px}
.ctrl-btn.primary:hover{opacity:.88}
.ctrl-btn i{font-size:18px}
.ctrl-btn.primary i{font-size:22px}
.speed-btn{background:none;border:1px solid var(--paper3);border-radius:16px;padding:.25rem .65rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--ink2);cursor:pointer;transition:border-color .15s}
.speed-btn:hover{border-color:var(--accent);color:var(--accent)}
.voice-row{display:flex;align-items:center;gap:.65rem;margin-top:.6rem;font-size:.75rem;color:var(--ink3);font-family:'DM Mono',monospace;flex-wrap:wrap}
.voice-row select{background:var(--paper2);border:1px solid var(--paper3);border-radius:6px;padding:.25rem .5rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--ink2);cursor:pointer;max-width:220px}
.page-nav{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--ink3);font-family:'DM Mono',monospace}
.page-nav button{background:none;border:1px solid var(--paper3);border-radius:5px;padding:.2rem .45rem;cursor:pointer;color:var(--ink2);font-family:'DM Mono',monospace;font-size:.75rem;transition:border-color .15s}
.page-nav button:hover{border-color:var(--accent)}
.page-nav input{width:42px;border:1px solid var(--paper3);border-radius:5px;text-align:center;padding:.2rem;font-family:'DM Mono',monospace;font-size:.75rem;background:var(--paper2);color:var(--ink)}

.loading-overlay{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.loading-bar{width:200px;height:3px;background:var(--paper3);border-radius:2px;overflow:hidden;margin-top:1rem}
.loading-fill{height:100%;background:var(--accent);border-radius:2px;animation:ld 1.5s ease-in-out infinite}
@keyframes ld{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
.load-text{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--ink3);margin-top:.75rem}

@media(max-width:600px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:50;height:100vh;width:var(--sidebar-w) !important}
  .sidebar.hidden{transform:translateX(-100%);width:var(--sidebar-w) !important}
  .text-area{padding:.85rem 1rem 0}
  .controls{padding:.65rem .85rem .95rem}
  .btn-row{gap:.55rem}
  .ctrl-btn{width:36px;height:36px}
  .ctrl-btn.primary{width:46px;height:46px}
  .book-header{padding:.65rem .85rem}
}
</style>
</head>
<body>
<div id="app">
  <!-- DROP SCREEN -->
  <div class="drop-screen" id="drop-screen" style="position:relative">
    <button class="theme-toggle drop-theme" id="theme-btn" aria-label="Toggle dark mode">
      <i class="ti ti-moon" id="theme-icon" aria-hidden="true"></i>
    </button>
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon"><i class="ti ti-book-2" aria-hidden="true"></i></div>
      <div class="drop-title">Drop your PDF here</div>
      <div class="drop-sub">or click to browse</div>
      <input type="file" id="file-input" accept=".pdf">
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player" id="player">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" id="sidebar-label">Chapters</span>
        <div class="sidebar-tabs">
          <button class="stab active" id="tab-chapters" onclick="switchTab('chapters')">Ch.</button>
          <button class="stab" id="tab-bookmarks" onclick="switchTab('bookmarks')">BM</button>
        </div>
      </div>
      <div class="sidebar-body" id="chapters-panel"></div>
      <div class="sidebar-body" id="bookmarks-panel" style="display:none"></div>
    </div>

    <div class="main">
      <div class="book-header">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <i class="ti ti-layout-sidebar" aria-hidden="true"></i>
        </button>
        <div class="book-cover"><i class="ti ti-book" aria-hidden="true"></i></div>
        <div class="book-meta">
          <div class="book-title" id="book-title">Book</div>
          <div class="book-pages" id="book-pages">—</div>
        </div>
        <div class="hdr-btns">
          <button class="hdr-btn" id="bookmark-btn" title="Bookmark this page">
            <i class="ti ti-bookmark" aria-hidden="true"></i>
          </button>
          <button class="hdr-btn theme-toggle" id="theme-btn2" aria-label="Toggle dark mode">
            <i class="ti ti-moon" id="theme-icon2" aria-hidden="true"></i>
          </button>
          <button class="hdr-btn" id="new-book-btn" title="Load new book">
            <i class="ti ti-refresh" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="resume-banner" id="resume-banner" style="display:none">
        <i class="ti ti-clock" aria-hidden="true"></i>
        <span id="resume-text">Resume from where you left off</span>
        <button class="resume-btn" id="resume-btn">Resume</button>
      </div>

      <div class="text-area" id="text-area">
        <div class="page-text" id="page-text"></div>
      </div>

      <div class="controls">
        <div class="progress-row">
          <span class="time-label" id="time-current">0:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <span class="time-label right" id="time-total">0:00</span>
        </div>
        <div class="btn-row">
          <div class="page-nav">
            <button id="prev-page">‹</button>
            <span>p.</span>
            <input type="number" id="page-input" value="1" min="1">
            <button id="next-page">›</button>
          </div>
          <button class="ctrl-btn" id="skip-back-btn" title="Back 15s">
            <i class="ti ti-rotate-clockwise-2" style="transform:scaleX(-1)" aria-hidden="true"></i>
          </button>
          <button class="ctrl-btn primary" id="play-btn" aria-label="Play">
            <i class="ti ti-player-play" id="play-icon" aria-hidden="true"></i>
          </button>
          <button class="ctrl-btn" id="skip-fwd-btn" title="Forward 15s">
            <i class="ti ti-rotate-clockwise-2" aria-hidden="true"></i>
          </button>
          <button class="speed-btn" id="speed-btn">1×</button>
        </div>
        <div class="voice-row">
          <i class="ti ti-microphone" aria-hidden="true"></i>
          <select id="voice-select"><option>Loading voices…</option></select>
        </div>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loading-overlay" style="display:none">
    <i class="ti ti-book-2" style="font-size:48px;color:var(--accent);opacity:.5" aria-hidden="true"></i>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <div class="load-text" id="load-text">Parsing your book…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const STORAGE_KEY = 'audiobook_v2';
const BM_KEY = 'audiobook_bookmarks_v2';

let pages = [], chapters = [], currentPage = 0, totalChars = 0, charsPerPage = [];
let synth = window.speechSynthesis, utter = null, voices = [];
let isPlaying = false, isPaused = false, charOffset = 0, speed = 1;
let selectedVoice = null, bookName = '', isDark = false;
let uttStartChar = 0, sidebarOpen = true, bookmarks = {};

const $ = id => document.getElementById(id);

/* THEME */
const appEl = $('app');
function applyTheme(dark) {
  isDark = dark;
  appEl.classList.toggle('dark', dark);
  const icon = dark ? 'ti ti-sun' : 'ti ti-moon';
  $('theme-icon').className = icon;
  if ($('theme-icon2')) $('theme-icon2').className = icon;
  localStorage.setItem('ab_theme', dark ? 'dark' : 'light');
}
$('theme-btn').addEventListener('click', () => applyTheme(!isDark));
document.addEventListener('click', e => {
  if (e.target.closest('#theme-btn2')) applyTheme(!isDark);
});
if (localStorage.getItem('ab_theme') === 'dark') applyTheme(true);

/* VOICES */
function loadVoices() {
  let all = synth.getVoices();
  let pref = all.filter(v => v.lang.startsWith('en') || v.lang.startsWith('pt') || v.lang.startsWith('es'));
  voices = pref.length ? pref : all;
  const sel = $('voice-select');
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  });
  if (selectedVoice) {
    const idx = voices.findIndex(v => v.name === selectedVoice.name);
    if (idx >= 0) sel.value = idx;
  }
}
synth.onvoiceschanged = loadVoices; loadVoices();
$('voice-select').addEventListener('change', e => {
  selectedVoice = voices[+e.target.value] || null;
  if (isPlaying) restartFromCurrentChar();
});

/* FILE DROP */
$('drop-zone').addEventListener('click', () => $('file-input').click());
$('drop-zone').addEventListener('dragover', e => { e.preventDefault(); $('drop-zone').classList.add('over'); });
$('drop-zone').addEventListener('dragleave', () => $('drop-zone').classList.remove('over'));
$('drop-zone').addEventListener('drop', e => { e.preventDefault(); $('drop-zone').classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
$('file-input').addEventListener('change', e => handleFile(e.target.files[0]));
$('new-book-btn').addEventListener('click', () => { stopSpeech(); location.reload(); });

/* PARSE PDF */
async function handleFile(file) {
  if (!file || !file.name.endsWith('.pdf')) return;
  bookName = file.name.replace('.pdf', '');
  bookmarks = JSON.parse(localStorage.getItem(BM_KEY + '_' + bookName) || '{}');
  $('loading-overlay').style.display = 'flex';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  pages = []; charsPerPage = []; chapters = []; totalChars = 0;

  for (let i = 1; i <= pdf.numPages; i++) {
    $('load-text').textContent = 'Page ' + i + ' of ' + pdf.numPages + '…';
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    let txt = '', prevY = null;
    tc.items.forEach(it => {
      if (prevY !== null && Math.abs(it.transform[5] - prevY) > 15) txt += '\n';
      txt += it.str;
      if (it.str.trim()) prevY = it.transform[5];
    });
    txt = txt.replace(/[ \t]{2,}/g, ' ').trim();
    pages.push(txt);
    charsPerPage.push(txt.length);
    totalChars += txt.length;
    detectChapter(txt, i - 1);
  }

  if (!chapters.length) chapters = [{ name: 'Beginning', page: 0 }];
  $('loading-overlay').style.display = 'none';
  $('book-title').textContent = bookName;
  $('book-pages').textContent = pdf.numPages + ' pages';
  $('page-input').max = pdf.numPages;
  $('drop-screen').style.display = 'none';
  $('player').style.display = 'flex';
  currentPage = 0; charOffset = 0;
  renderPage(); renderChapters(); renderBookmarks(); checkResume();
}

function detectChapter(txt, pageIdx) {
  const lines = txt.split('\n').slice(0, 4);
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (/^(chapter|part|section|prologue|epilogue|introduction|preface|appendix)\b/i.test(t) ||
        /^(ch\.?\s*\d+|\d+\.\s+[A-Z])/i.test(t)) {
      if (t.length < 80) { chapters.push({ name: t, page: pageIdx }); return; }
    }
    if (t.length < 60 && t === t.toUpperCase() && t.replace(/\s/g, '').length > 3) {
      chapters.push({ name: t.charAt(0) + t.slice(1).toLowerCase(), page: pageIdx }); return;
    }
  }
}

/* CHAPTERS */
function renderChapters() {
  const panel = $('chapters-panel');
  panel.innerHTML = '';
  if (!chapters.length) { panel.innerHTML = '<div class="bm-empty">No chapters detected</div>'; return; }
  chapters.forEach((ch, i) => {
    const isActive = currentPage >= ch.page && (i === chapters.length - 1 || currentPage < chapters[i + 1].page);
    const d = document.createElement('div');
    d.className = 'chapter-item' + (isActive ? ' active' : '');
    d.innerHTML = '<span class="chapter-num">' + (i + 1) + '</span><span class="chapter-name">' + escH(ch.name) + '</span>';
    d.addEventListener('click', () => {
      currentPage = ch.page; charOffset = 0;
      renderPage(); renderChapters();
      if (isPlaying) restartFromCurrentChar();
    });
    panel.appendChild(d);
  });
}

/* BOOKMARKS */
function renderBookmarks() {
  const panel = $('bookmarks-panel');
  panel.innerHTML = '';
  const keys = Object.keys(bookmarks);
  if (!keys.length) {
    panel.innerHTML = '<div class="bm-empty">No bookmarks yet.<br>Tap the ribbon icon<br>while reading.</div>';
    return;
  }
  keys.sort((a, b) => +a - +b).forEach(pg => {
    const bm = bookmarks[pg];
    const d = document.createElement('div');
    d.className = 'bm-item';
    d.innerHTML = '<i class="ti ti-bookmark" style="color:var(--accent);font-size:14px;flex-shrink:0" aria-hidden="true"></i>' +
      '<span style="flex:1;font-size:.82rem;color:var(--ink2)">Page ' + (+pg + 1) + (bm.label ? ' — ' + escH(bm.label.slice(0, 35)) + '…' : '') + '</span>' +
      '<button class="bm-del" title="Remove bookmark"><i class="ti ti-x" aria-hidden="true"></i></button>';
    d.addEventListener('click', e => {
      if (e.target.closest('.bm-del')) {
        delete bookmarks[pg]; saveBookmarks(); renderBookmarks(); return;
      }
      currentPage = +pg; charOffset = 0;
      renderPage(); renderChapters();
      if (isPlaying) restartFromCurrentChar();
    });
    panel.appendChild(d);
  });
}

function saveBookmarks() { localStorage.setItem(BM_KEY + '_' + bookName, JSON.stringify(bookmarks)); }

$('bookmark-btn').addEventListener('click', () => {
  const pg = String(currentPage);
  const btn = $('bookmark-btn');
  if (bookmarks[pg]) {
    delete bookmarks[pg]; btn.classList.remove('bookmarked');
  } else {
    const snippet = pages[currentPage] ? pages[currentPage].slice(0, 40).trim() : '';
    bookmarks[pg] = { label: snippet }; btn.classList.add('bookmarked');
  }
  saveBookmarks(); renderBookmarks();
});

function updateBookmarkBtn() { $('bookmark-btn').classList.toggle('bookmarked', !!bookmarks[String(currentPage)]); }

/* SIDEBAR */
$('sidebar-toggle').addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  $('sidebar').classList.toggle('hidden', !sidebarOpen);
});

function switchTab(tab) {
  $('chapters-panel').style.display = tab === 'chapters' ? 'block' : 'none';
  $('bookmarks-panel').style.display = tab === 'bookmarks' ? 'block' : 'none';
  $('tab-chapters').classList.toggle('active', tab === 'chapters');
  $('tab-bookmarks').classList.toggle('active', tab === 'bookmarks');
  $('sidebar-label').textContent = tab === 'chapters' ? 'Chapters' : 'Bookmarks';
}

/* RESUME */
function checkResume() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  const data = JSON.parse(saved);
  if (data.book !== bookName) return;
  const pct = Math.round((data.page / Math.max(pages.length - 1, 1)) * 100);
  $('resume-text').textContent = 'Resume from page ' + (data.page + 1) + ' (' + pct + '% through)';
  $('resume-banner').style.display = 'flex';
  $('resume-btn').onclick = () => {
    $('resume-banner').style.display = 'none';
    currentPage = data.page; charOffset = data.charOffset || 0;
    renderPage(); renderChapters();
  };
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ book: bookName, page: currentPage, charOffset: charOffset }));
}

/* RENDER */
function renderPage() {
  $('page-text').textContent = pages[currentPage] || '';
  $('page-input').value = currentPage + 1;
  updateProgress(); updateBookmarkBtn();
  $('text-area').scrollTop = 0;
}

function getGlobalChar() {
  let g = 0;
  for (let i = 0; i < currentPage; i++) g += charsPerPage[i] || 0;
  return g + charOffset;
}

function updateProgress() {
  const g = getGlobalChar();
  const pct = totalChars ? g / totalChars * 100 : 0;
  $('progress-fill').style.width = pct + '%';
  const estSec = totalChars / (150 * speed / 60);
  const elapsedSec = estSec * pct / 100;
  $('time-current').textContent = formatTime(elapsedSec);
  $('time-total').textContent = formatTime(estSec);
}

function formatTime(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return h + ':' + pad(m) + ':' + pad(sec);
  return m + ':' + pad(sec);
}
function pad(n) { return String(n).padStart(2, '0'); }
function escH(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* PROGRESS BAR CLICK */
$('progress-bar').addEventListener('click', e => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const target = Math.round(totalChars * pct);
  let cum = 0;
  for (let i = 0; i < pages.length; i++) {
    if (cum + (charsPerPage[i] || 0) >= target) { currentPage = i; charOffset = target - cum; break; }
    cum += charsPerPage[i] || 0;
  }
  renderPage(); renderChapters();
  if (isPlaying) restartFromCurrentChar();
});

/* SPEECH */
function speak() {
  if (!pages.length) return;
  const txt = pages[currentPage] || '';
  const remaining = txt.slice(charOffset);
  if (!remaining.trim()) {
    if (currentPage < pages.length - 1) { currentPage++; charOffset = 0; renderPage(); renderChapters(); speak(); }
    else setPlayState(false);
    return;
  }
  uttStartChar = charOffset;
  utter = new SpeechSynthesisUtterance(remaining);
  utter.rate = speed;
  if (selectedVoice) utter.voice = selectedVoice;
  else if (voices.length) utter.voice = voices[0];
  utter.onboundary = e => {
    if (e.name === 'word') {
      charOffset = uttStartChar + e.charIndex;
      highlightWord(charOffset, e.charLength || 5);
      updateProgress(); saveProgress();
    }
  };
  utter.onend = () => {
    if (isPaused) return;
    if (currentPage < pages.length - 1) { currentPage++; charOffset = 0; renderPage(); renderChapters(); speak(); }
    else { setPlayState(false); charOffset = 0; saveProgress(); }
  };
  synth.speak(utter);
}

function highlightWord(start, len) {
  const full = pages[currentPage] || '';
  const el = $('page-text');
  el.innerHTML = '<span>' + escH(full.slice(0, start)) + '</span>' +
    '<span class="highlight">' + escH(full.slice(start, start + len)) + '</span>' +
    '<span>' + escH(full.slice(start + len)) + '</span>';
  const hl = el.querySelector('.highlight');
  if (hl) hl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function stopSpeech() { synth.cancel(); utter = null; }
function setPlayState(p) { isPlaying = p; $('play-icon').className = p ? 'ti ti-player-pause' : 'ti ti-player-play'; }
function restartFromCurrentChar() { synth.cancel(); setTimeout(() => { if (isPlaying) speak(); }, 80); }

$('play-btn').addEventListener('click', () => {
  if (isPlaying) { synth.cancel(); isPaused = true; setPlayState(false); saveProgress(); }
  else { isPaused = false; setPlayState(true); speak(); }
});

$('skip-back-btn').addEventListener('click', () => {
  charOffset = Math.max(0, charOffset - Math.round(15 * (150 / 60) * speed));
  if (isPlaying) restartFromCurrentChar(); else updateProgress();
});
$('skip-fwd-btn').addEventListener('click', () => {
  charOffset = Math.min((pages[currentPage] || '').length - 1, charOffset + Math.round(15 * (150 / 60) * speed));
  if (isPlaying) restartFromCurrentChar(); else updateProgress();
});

const speeds = [0.75, 1, 1.25, 1.5, 2]; let speedIdx = 1;
$('speed-btn').addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length; speed = speeds[speedIdx];
  $('speed-btn').textContent = speed + '×';
  if (isPlaying) restartFromCurrentChar();
});

$('prev-page').addEventListener('click', () => {
  if (currentPage > 0) { currentPage--; charOffset = 0; renderPage(); renderChapters(); if (isPlaying) restartFromCurrentChar(); }
});
$('next-page').addEventListener('click', () => {
  if (currentPage < pages.length - 1) { currentPage++; charOffset = 0; renderPage(); renderChapters(); if (isPlaying) restartFromCurrentChar(); }
});
$('page-input').addEventListener('change', e => {
  const p = Math.max(1, Math.min(pages.length, +e.target.value)) - 1;
  currentPage = p; charOffset = 0; renderPage(); renderChapters();
  if (isPlaying) restartFromCurrentChar();
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/audiobook-reader/sw.js'));
}
</script>
